<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MCQ Viewer</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
window.MathJax = {
  tex: { inlineMath: [['$','$'],['\\(','\\)']], displayMath: [['$$','$$']] },
  options: { skipHtmlTags: ['script','noscript','style','textarea','pre'] }
};
</script>
<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js" async></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+Bengali:wght@400;500;600;700&family=Noto+Sans+Bengali:wght@400;500&family=JetBrains+Mono:wght@400;600&display=swap');

:root {
  --paper: #f0ebe0;
  --paper2: #e8e0cc;
  --paper3: #ddd5c0;
  --ink: #1a1208;
  --ink2: #3d2f1a;
  --ink3: #6b5a3e;
  --ink4: #9a8668;
  --accent: #4a3520;
  --red-mark: #c0392b;
  --green-mark: #1a6b35;
  --blue-mark: #1a3a6b;
  --border: #c8b89a;
  --border2: #b0a080;
  --sidebar-bg: #2a2218;
  --sidebar-text: #d4c8b0;
  --sidebar-text2: #8a7a60;
  --sidebar-hover: #3a3028;
  --sidebar-border: #3d3528;
  --tag-bg: #3d3020;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Noto Serif Bengali', 'SolaimanLipi', serif;
  background: var(--paper);
  color: var(--ink);
  min-height: 100vh;
}

/* ── UPLOAD ── */
#upload-screen {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  min-height: 100vh; padding: 2rem;
  background: radial-gradient(ellipse at 50% 20%, #2e2416 0%, #1a1208 60%);
}
.upload-logo {
  font-family: 'JetBrains Mono', monospace; font-size: .8rem;
  letter-spacing: .25em; color: #c8a96e; text-transform: uppercase; margin-bottom: 2rem;
}
.upload-title {
  font-size: 2rem; font-weight: 700; text-align: center; margin-bottom: .5rem;
  color: #e8d9b8;
}
.upload-sub { color: #8a7a60; margin-bottom: 3rem; }
.drop-zone {
  width: 400px; max-width: 100%; border: 2px dashed #4a3d28; border-radius: 12px;
  padding: 3rem 2rem; text-align: center; cursor: pointer; transition: all .2s;
  background: #211a10; position: relative;
}
.drop-zone:hover, .drop-zone.drag-over { border-color: #c8a96e; background: #2a2010; }
.drop-icon { font-size: 3rem; margin-bottom: 1rem; display: block; }
.drop-zone p { color: #a08860; margin-bottom: .5rem; }
.drop-zone span { color: #6a5840; font-size: .85rem; }
.drop-zone input[type=file] { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
#upload-status { margin-top: 1.5rem; color: #a08860; font-size: .9rem; text-align: center; min-height: 1.2em; }

/* ── PYODIDE LOADING ── */
#py-loading {
  display: none; position: fixed; inset: 0;
  background: rgba(26,18,8,.88); z-index: 999;
  align-items: center; justify-content: center; flex-direction: column; gap: 1.2rem;
}
.py-spinner {
  width: 44px; height: 44px; border: 3px solid #3d3020;
  border-top-color: #c8a96e; border-radius: 50%;
  animation: spin .8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.py-loading-text { color: #a08860; font-size: .9rem; font-family: 'JetBrains Mono', monospace; }

/* ── APP ── */
#app { display: none; }

.topbar {
  background: var(--sidebar-bg); border-bottom: 1px solid var(--sidebar-border);
  padding: .65rem 1.2rem; display: flex; align-items: center;
  justify-content: space-between;
  position: sticky; top: 0; z-index: 100;
}
.topbar-title {
  font-family: 'JetBrains Mono', monospace; font-size: .75rem;
  color: #c8a96e; letter-spacing: .15em; text-transform: uppercase;
}
.count-badge {
  background: var(--tag-bg); border: 1px solid #4a3d28; border-radius: 20px;
  padding: .18rem .7rem; font-size: .78rem; color: var(--sidebar-text2);
  font-family: 'JetBrains Mono', monospace;
}
.btn-reload {
  background: none; border: 1px solid #4a3d28; color: var(--sidebar-text2);
  padding: .35rem .9rem; border-radius: 5px; cursor: pointer; font-size: .78rem;
  font-family: 'Noto Sans Bengali', sans-serif; transition: all .15s;
}
.btn-reload:hover { border-color: #c8a96e; color: #c8a96e; }

/* ── NAV TABS ── */
.nav-tabs {
  display: flex; align-items: center; gap: .15rem;
  flex: 1; justify-content: center;
}
.nav-tab {
  background: none; border: none;
  color: var(--sidebar-text2);
  padding: .35rem .9rem; border-radius: 5px;
  cursor: pointer; font-size: .88rem;
  font-family: 'Noto Serif Bengali', serif;
  transition: all .15s; letter-spacing: .02em;
  white-space: nowrap;
}
.nav-tab:hover { color: #c8a96e; }
.nav-tab.active {
  background: #3a3028; color: #c8a96e;
  font-weight: 600;
}

@media (max-width: 600px) {
  .topbar { padding: .55rem .75rem; }
  .topbar-title { display: none; }
  .count-badge { display: none !important; }
  .btn-reload { padding: .3rem .6rem; font-size: .72rem; }
  .nav-tab { padding: .3rem .65rem; font-size: .82rem; }

  .content {
    padding: 0 !important;
    margin-left: 0 !important;
  }

  .stem-group { margin-bottom: 1rem; }
  .stem-banner { padding: .6rem .75rem !important; font-size: .88rem; }
  .stimulus-body { padding: .1rem .75rem .6rem !important; }
  .stimulus-text { font-size: .88rem; }

  .question-block { padding: .75rem .75rem .9rem !important; }
  .q-header { gap: .5rem; }
  .q-num { font-size: .9rem; }
  .q-text-inline { font-size: .9rem; }
  .q-meta { margin-top: .4rem; }

  .options-grid { grid-template-columns: 1fr !important; gap: .4rem; }
  .option { font-size: .86rem; padding: .5rem .65rem; }

  .statements { padding: .1rem 0 .3rem; }
  .statement-row { font-size: .86rem; }

  .standalone-card { margin-bottom: .9rem; }
  .no-results { padding: 2rem 1rem; }

  .pagination { padding: 1rem 0 1.5rem; gap: .3rem; }
  .page-btn { padding: .35rem .6rem; font-size: .78rem; min-width: 30px; }

  .sidebar-toggle { top: 54px; }
}

.tab-panel { display: none; }
.tab-panel.active { display: block; }

.empty-tab {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  height: calc(100vh - 46px);
  color: var(--ink4);
}
.empty-tab-icon { font-size: 3rem; margin-bottom: 1rem; opacity: .5; }
.empty-tab-title { font-size: 1.3rem; font-weight: 600; color: var(--ink3); margin-bottom: .4rem; }
.empty-tab-sub { font-size: .88rem; color: var(--ink4); }

.layout { display: flex; height: calc(100vh - 46px); position: relative; }

/* ── SIDEBAR OVERLAY BG — disabled since content shifts ── */
.sidebar-overlay-bg { display: none; }

.sidebar {
  position: fixed; top: 46px; left: 0; bottom: 0;
  width: 260px; background: var(--sidebar-bg);
  border-right: 1px solid var(--sidebar-border);
  overflow-y: auto; padding: .75rem 0;
  z-index: 60;
  transform: translateX(-100%);
  transition: transform .28s cubic-bezier(.4,0,.2,1);
}
.sidebar.open { transform: translateX(0); }
.sidebar::-webkit-scrollbar { width: 3px; }
.sidebar::-webkit-scrollbar-thumb { background: #4a3d28; border-radius: 2px; }

/* Toggle button — sticks to right edge of sidebar */
.sidebar-toggle {
  position: fixed; top: 56px; left: 0; z-index: 70;
  width: 28px; height: 34px;
  background: var(--sidebar-bg);
  border: 1px solid var(--sidebar-border);
  border-left: none;
  border-radius: 0 8px 8px 0;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: left .28s cubic-bezier(.4,0,.2,1), opacity .28s ease, background .15s, border-color .15s;
  padding: 0;
  opacity: 0.5;
  transform: none;
}
.sidebar-toggle.open { left: 260px; opacity: 1; }
.sidebar-toggle:hover { background: var(--sidebar-hover); border-color: #c8a96e; opacity: 1; }

/* Animated hamburger → X icon */
.tog-icon {
  width: 16px; height: 12px;
  position: relative; display: flex; flex-direction: column;
  justify-content: space-between;
}
.tog-icon span {
  display: block; height: 1.5px; background: var(--sidebar-text2);
  border-radius: 2px;
  transform-origin: center;
  transition: transform .28s ease, opacity .2s ease, top .28s ease;
  position: relative;
}
/* open state — turns into X */
.sidebar-toggle.open .tog-icon span:nth-child(1) {
  transform: translateY(5.25px) rotate(45deg);
}
.sidebar-toggle.open .tog-icon span:nth-child(2) {
  opacity: 0; transform: scaleX(0);
}
.sidebar-toggle.open .tog-icon span:nth-child(3) {
  transform: translateY(-5.25px) rotate(-45deg);
}
.sidebar-toggle.open { border-color: #c8a96e; }
.sidebar-toggle.open .tog-icon span { background: #c8a96e; }

.filter-group { border-bottom: 1px solid var(--sidebar-border); padding-bottom: .4rem; margin-bottom: .4rem; }
.filter-group:last-child { border-bottom: none; }
.filter-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: .55rem 1.1rem; cursor: pointer; user-select: none;
}
.filter-header:hover { background: var(--sidebar-hover); }
.filter-label { font-size: .72rem; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--sidebar-text2); }
.filter-arrow { color: var(--sidebar-text2); font-size: .65rem; transition: transform .2s; }
.filter-arrow.open { transform: rotate(90deg); }
.filter-sel-count {
  background: #c8a96e; color: #1a1208; border-radius: 10px;
  padding: .08rem .45rem; font-size: .67rem; font-weight: 700;
}
.filter-options { padding: .2rem 0; display: none; }
.filter-options.open { display: block; }
.filter-option {
  display: flex; align-items: center; gap: .55rem; padding: .4rem 1.1rem;
  cursor: pointer; transition: background .1s; font-size: .84rem; color: var(--sidebar-text2);
}
.filter-option:hover { background: var(--sidebar-hover); color: var(--sidebar-text); }
.filter-option.selected { color: #c8a96e; }
.filter-checkbox {
  width: 14px; height: 14px; border: 1.5px solid #4a3d28; border-radius: 3px;
  display: flex; align-items: center; justify-content: center; flex-shrink: 0;
}
.filter-option.selected .filter-checkbox { background: #c8a96e; border-color: #c8a96e; }
.filter-option.selected .filter-checkbox::after { content: '✓'; color: #1a1208; font-size: .6rem; font-weight: 700; }
.clear-filter { padding: .25rem 1.1rem; font-size: .72rem; color: #6a5840; cursor: pointer; display: inline-block; }
.clear-filter:hover { color: var(--red-mark); }

/* ── CONTENT / PAPER ── */
.content {
  width: 100%;
  min-height: calc(100vh - 46px);
  overflow-y: auto; background: var(--paper);
  padding: 2rem 2.5rem;
  margin-left: 0;
  transition: margin-left .28s cubic-bezier(.4,0,.2,1);
}
.content.shifted { margin-left: 260px; width: calc(100% - 260px); }
.content::-webkit-scrollbar { width: 6px; }
.content::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

.no-results { text-align: center; padding: 4rem 2rem; color: var(--ink4); }

/* ── STEM GROUP (stimulus + grouped questions) ── */
.stem-group {
  margin-bottom: 2.5rem;
  background: var(--paper);
  overflow: hidden;
}

.stem-banner {
  padding: .7rem 1.5rem;
  font-size: .97rem;
  font-weight: 700;
  color: var(--ink);
  line-height: 1.8;
}

.stimulus-body {
  padding: .25rem 1.5rem .9rem;
}
.stimulus-text {
  font-size: .95rem; line-height: 1.9; color: var(--ink2);
}
.stimulus-img { text-align: center; margin-bottom: .6rem; }
.stimulus-img img { max-width: 100%; }
.question-img { text-align: center; margin-bottom: .75rem; }
.question-img img { max-width: 100%; }
.option-img { text-align: center; width: 100%; }
.option-img img { max-width: 100%; }
.img-placeholder {
  display: flex; align-items: center; justify-content: center;
  padding: .6rem; color: var(--ink4); font-size: .78rem; gap: .4rem;
}
.img-placeholder.loading { animation: blink 1.4s ease-in-out infinite; }
@keyframes blink { 0%,100%{opacity:.5;} 50%{opacity:1;} }

/* ── STANDALONE CARD ── */
.standalone-card {
  margin-bottom: 1.4rem;
  background: var(--paper);
  overflow: hidden;
}

/* ── QUESTION BLOCK (inside group or standalone) ── */
.question-block {
  padding: 1rem 1.5rem 1.2rem;
  border-bottom: 1px solid var(--border);
}
.question-block:last-child { border-bottom: none; }

.q-header {
  display: flex; align-items: baseline; gap: .75rem;
  margin-bottom: .75rem; flex-wrap: wrap;
}
.q-num {
  font-size: .97rem; font-weight: 700; color: var(--ink);
  flex-shrink: 0;
}
.q-text-inline {
  font-size: .97rem; line-height: 1.85; color: var(--ink);
  font-weight: 500; flex: 1;
}
.q-meta {
  display: flex; align-items: center; gap: .4rem;
  margin-bottom: .7rem; flex-wrap: wrap;
}
.q-tag {
  font-size: .7rem; padding: .15rem .5rem; border-radius: 3px;
  background: var(--paper3); color: var(--ink3);
  border: 1px solid var(--border);
}

.question-img { text-align: center; margin-bottom: .75rem; }
.question-img img { max-width: 100%; border-radius: 4px; border: 1px solid var(--border); }

.question-text {
  font-size: .97rem; line-height: 1.85; color: var(--ink);
  margin-bottom: .9rem; font-weight: 500;
}

/* Statements */
.statements {
  padding: .2rem 0 .5rem 0;
  margin-bottom: .5rem;
}
.statement-row {
  display: flex; gap: .5rem; padding: .28rem 0;
  font-size: .92rem; line-height: 1.75; color: var(--ink2);
}
.stmt-label { font-size: .88rem; color: var(--ink3); min-width: 28px; padding-top: .1rem; }
.niche-text { font-size: .92rem; color: var(--ink2); margin-bottom: .6rem; }

/* Options */
.options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: .6rem; margin-top: .7rem; }
.options-grid-img { grid-template-columns: 1fr 1fr; }
@media(max-width:600px) { .options-grid { grid-template-columns: 1fr; } }

.option {
  display: flex; align-items: center; gap: .65rem;
  padding: .65rem .9rem; border-radius: 8px;
  border: 1.5px solid var(--border); font-size: .92rem; line-height: 1.65;
  background: var(--paper); cursor: pointer;
  transition: background .15s, border-color .15s, transform .1s, box-shadow .15s;
  user-select: none;
}
.option:hover {
  background: var(--paper2); border-color: var(--ink4);
  box-shadow: 1px 2px 6px rgba(60,40,10,.07);
}
.option:active { transform: scale(.99); }
.option-key {
  font-size: .82rem; font-weight: 700;
  flex-shrink: 0; color: var(--ink3);
  width: 24px; height: 24px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  background: var(--paper3); border: 1px solid var(--border);
  transition: all .15s;
}
.option:hover .option-key { border-color: var(--ink4); }

/* ── ANSWER FOOTER ── */
.answer-footer {
  display: none;
  margin-top: 1rem;
  animation: fadeSlideIn .3s ease;
}
.answer-footer.visible { display: block; }

@keyframes fadeSlideIn {
  from { opacity: 0; transform: translateY(-6px); }
  to { opacity: 1; transform: translateY(0); }
}

.answer-bar {
  display: flex; align-items: center; gap: .6rem; flex-wrap: wrap;
  padding: .6rem .9rem;
  border-radius: 6px;
}
.answer-bar.is-correct { background: #e8f5ec; border: 1px solid #a8d8b5; }
.answer-bar.is-wrong   { background: #fbeae7; border: 1px solid #eab5ac; }

.answer-verdict {
  font-size: .92rem; font-weight: 700; flex: 1;
  display: flex; align-items: center; gap: .4rem;
}
.answer-verdict::before {
  font-size: 1rem; line-height: 1;
}
.answer-verdict.correct-text { color: var(--green-mark); }
.answer-verdict.correct-text::before { content: '✓'; }
.answer-verdict.wrong-text { color: var(--red-mark); }
.answer-verdict.wrong-text::before { content: '✕'; }

.footer-btn {
  font-size: .8rem; padding: .35rem .9rem;
  border-radius: 20px; border: 1px solid;
  cursor: pointer;
  font-family: 'Noto Serif Bengali', serif;
  transition: all .15s;
  background: var(--paper);
}
.footer-btn.explain-btn {
  color: var(--blue-mark); border-color: #a8c0e0;
}
.footer-btn.explain-btn:hover { background: #eaf1fb; }
.footer-btn.explain-btn.active { background: var(--blue-mark); color: white; border-color: var(--blue-mark); }

.footer-btn.report-btn {
  color: var(--red-mark); border-color: #e8b8b0;
}
.footer-btn.report-btn:hover { background: #fdf0ee; }

/* ── EXPLANATION PANEL ── */
.explanation-panel {
  display: none;
  margin-top: .6rem;
  padding: 1rem 1.1rem;
  background: var(--paper2);
  border-radius: 6px;
  border-left: 3px solid var(--blue-mark);
  font-size: .92rem; line-height: 1.9; color: var(--ink2);
  animation: fadeSlideIn .25s ease;
}
.explanation-panel.visible { display: block; }
.explanation-label {
  font-size: .76rem; font-weight: 700; color: var(--blue-mark);
  text-transform: uppercase; letter-spacing: .08em;
  margin-bottom: .5rem; opacity: .8;
}

/* ── REPORT MODAL ── */
.report-overlay {
  display: none; position: fixed; inset: 0;
  background: rgba(26,18,8,.6); z-index: 200;
  align-items: center; justify-content: center;
  padding: 1rem;
}
.report-overlay.open { display: flex; }
.report-modal {
  background: var(--paper); border: 1px solid var(--border);
  border-radius: 8px; padding: 1.5rem;
  width: 100%; max-width: 380px;
  box-shadow: 0 8px 32px rgba(0,0,0,.25);
}
.report-title {
  font-size: 1rem; font-weight: 700; color: var(--ink);
  margin-bottom: 1rem; padding-bottom: .6rem;
  border-bottom: 1px solid var(--border);
}
.report-options { display: flex; flex-direction: column; gap: .4rem; margin-bottom: 1rem; }
.report-option {
  display: flex; align-items: center; gap: .6rem;
  padding: .45rem .6rem; border-radius: 4px; cursor: pointer;
  font-size: .88rem; color: var(--ink2);
  border: 1px solid transparent;
  transition: background .12s;
}
.report-option:hover { background: var(--paper2); }
.report-option input[type=checkbox] { accent-color: var(--red-mark); width: 15px; height: 15px; flex-shrink: 0; }
.report-other-box {
  display: none; width: 100%;
  border: 1px solid var(--border); border-radius: 4px;
  padding: .5rem .75rem; font-size: .88rem;
  font-family: 'Noto Serif Bengali', serif;
  background: var(--paper2); color: var(--ink);
  resize: vertical; min-height: 70px; margin-top: .3rem;
}
.report-other-box:focus { outline: none; border-color: var(--border2); }
.report-actions { display: flex; gap: .5rem; justify-content: flex-end; }
.report-cancel {
  padding: .4rem 1rem; border-radius: 4px; border: 1px solid var(--border);
  background: var(--paper2); color: var(--ink3); cursor: pointer;
  font-size: .85rem; font-family: 'Noto Serif Bengali', serif;
}
.report-submit {
  padding: .4rem 1.2rem; border-radius: 4px; border: none;
  background: var(--red-mark); color: white; cursor: pointer;
  font-size: .85rem; font-family: 'Noto Serif Bengali', serif;
  transition: opacity .15s;
}
.report-submit:hover { opacity: .85; }
.report-success {
  text-align: center; padding: 1rem 0;
  color: var(--green-mark); font-size: .95rem; font-weight: 600;
}
.option.wrong {
  background: #fbeae7; border-color: var(--red-mark);
  pointer-events: none; cursor: default;
}
.option.wrong .option-key {
  background: var(--red-mark); border-color: var(--red-mark); color: white;
}

.option.correct-reveal {
  background: #e8f5ec; border-color: var(--green-mark);
  pointer-events: none; cursor: default;
}
.option.correct-reveal .option-key {
  background: var(--green-mark); border-color: var(--green-mark); color: white;
}

.option.answered:not(.wrong):not(.correct-reveal) {
  pointer-events: none; cursor: default; opacity: .55;
}

/* ── PAGINATION ── */
.pagination {
  display: flex; align-items: center; justify-content: center;
  gap: .45rem; padding: 1.5rem 0 2.5rem; flex-wrap: wrap;
}
.page-btn {
  background: var(--paper2); border: 1px solid var(--border); color: var(--ink3);
  padding: .38rem .75rem; border-radius: 4px; cursor: pointer; font-size: .84rem;
  font-family: 'Noto Sans Bengali', sans-serif; transition: all .12s; min-width: 34px; text-align: center;
}
.page-btn:hover { border-color: var(--border2); color: var(--ink); background: var(--paper3); }
.page-btn.active { background: var(--ink2); border-color: var(--ink2); color: var(--paper); }
.page-btn:disabled { opacity: .35; cursor: default; }

/* ══ LEARN TAB ══ */
.learn-layout { display: flex; height: calc(100vh - 46px); overflow: hidden; }
.learn-sidebar {
  width: 210px; min-width: 210px; flex-shrink: 0;
  background: var(--sidebar-bg);

<body>

  <div class="py-spinner"></div>

<!-- LOADING SCREEN -->

</div>

<!-- APP -->
<div id="app">
  <div class="topbar">
    <div style="display:flex;align-items:center;gap:.8rem">

    </div>
  </div>
</div>

<script>
// ── STATE ──
let allData = [];
let filters = { board: new Set(), year: new Set(), chapter: new Set() };
let currentPage = 1;
const PER_PAGE = 15;
let pyodide = null;
let pyodideReady = false;
let imageCache = {}; // key: code string -> dataURL

// ── JSON AUTO-LOAD FROM GITHUB ──
const SUPABASE_URL = 'https://npfpotqeeyftpdjelose.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5wZnBvdHFlZXlmdHBkamVsb3NlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODExMTU4ODksImV4cCI6MjA5NjY5MTg4OX0.Vcqvaz2zQsSlT_tDv1vMYEjgZZfcO7eza4AgKRKfHHA';

async function loadFromJSON() {
  document.getElementById('upload-status').textContent = 'ডেটা লোড হচ্ছে...';
  try {
    let allRows = [];
    let from = 0;
    const batchSize = 1000;
    while (true) {
      const to = from + batchSize - 1;
      const res = await fetch(
        `${SUPABASE_URL}/rest/v1/gh?select=*`,
        {
          headers: {
            'apikey': SUPABASE_KEY,
            'Authorization': 'Bearer ' + SUPABASE_KEY,
            'Range': `${from}-${to}`
          }
        }
      );
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const batch = await res.json();
      if (!Array.isArray(batch) || !batch.length) break;
      allRows = allRows.concat(batch);
      if (batch.length < batchSize) break;
      from += batchSize;
    }
    allData = allRows.map((r, i) => ({ ...r, _id: i }));
    document.getElementById('upload-status').textContent = `✓ ${allData.length} টি প্রশ্ন লোড হয়েছে`;
    setTimeout(startApp, 300);
  } catch (err) {
    document.getElementById('upload-status').textContent = '❌ ডেটা লোড ব্যর্থ: ' + err.message;
  }
}

// Auto-load on page ready
window.addEventListener('DOMContentLoaded', loadFromJSON);

function startApp() {
  document.getElementById('upload-screen').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  filters = { board: new Set(), year: new Set(), chapter: new Set() };
  // Open sidebar by default
  document.getElementById('sidebar').classList.add('open');
  document.getElementById('sidebar-toggle').classList.add('open');
  document.getElementById('sidebar-bg').classList.add('open');
  document.getElementById('content').classList.add('shifted');
  switchTab('practice');
  buildSidebar();
  renderContent();
  initLearn();
  loadPyodideScript().then(() => initPyodide());
}

function switchTab(tab) {
  document.querySelectorAll('.nav-tab').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.tab-panel').forEach(p => {
    p.classList.remove('active');
    p.style.display = 'none';
  });
  document.querySelector(`.nav-tab[onclick="switchTab('${tab}')"]`).classList.add('active');
  const panel = document.getElementById('tab-' + tab);
  panel.classList.add('active');
  panel.style.display = 'block';
  const badge = document.getElementById('result-count');
  badge.style.display = tab === 'practice' ? 'inline-block' : 'none';
  if (tab === 'learn' && allData && allData.length > 0) {
    buildLearnSidebar();
    renderLearnContent();
  }
}

function toggleSidebar() {
  const sidebar = document.getElementById('sidebar');
  const btn = document.getElementById('sidebar-toggle');
  const bg = document.getElementById('sidebar-bg');
  const content = document.getElementById('content');
  const isOpen = sidebar.classList.toggle('open');
  btn.classList.toggle('open', isOpen);
  bg.classList.toggle('open', isOpen);
  content.classList.toggle('shifted', isOpen);
}

function resetApp() {
  document.getElementById('upload-screen').style.display = 'flex';
  document.getElementById('app').style.display = 'none';
  document.getElementById('upload-status').textContent = '';
  allData = []; imageCache = {};
  loadFromJSON();
}

// ── PYODIDE ──
function loadPyodideScript() {
  return new Promise((res, rej) => {
    if (window.loadPyodide) { res(); return; }
    const s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/pyodide/v0.25.1/full/pyodide.js';
    s.onload = res; s.onerror = rej;
    document.head.appendChild(s);
  });
}

async function initPyodide() {
  if (pyodideReady) return;
  const overlay = document.getElementById('py-loading');
  const txt = document.getElementById('py-loading-text');
  overlay.style.display = 'flex';
  txt.textContent = 'Python engine লোড হচ্ছে... (~5MB)';
  try {
    pyodide = await loadPyodide({ indexURL: 'https://cdn.jsdelivr.net/pyodide/v0.25.1/full/' });
    txt.textContent = 'matplotlib লোড হচ্ছে...';
    await pyodide.loadPackage(['matplotlib', 'numpy']);
    pyodideReady = true;
    txt.textContent = '✓ প্রস্তুত!';
    await new Promise(r => setTimeout(r, 500));
    overlay.style.display = 'none';
    renderImagesForPage();
  } catch(e) {
    txt.textContent = '❌ Python লোড ব্যর্থ';
    setTimeout(() => overlay.style.display = 'none', 3000);
  }
}

// ── FILTER DATA ──
function getFilteredData() {
  return allData.filter(row => {
    if (filters.board.size > 0 && !filters.board.has(String(row['Board Name'] ?? ''))) return false;
    if (filters.year.size > 0 && !filters.year.has(String(row['Year'] != null ? Math.round(row['Year']) : ''))) return false;
    if (filters.chapter.size > 0 && !filters.chapter.has(String(row['Chapter'] != null ? Math.round(row['Chapter']) : ''))) return false;
    return true;
  });
}

// ── GROUP ROWS into display units ──
// A "unit" is either:
//   { type:'stem', stimulus, stimImgCode, rows: [...] }
//   { type:'standalone', row }
function groupIntoUnits(rows) {
  const units = [];
  let i = 0;
  while (i < rows.length) {
    const row = rows[i];
    const hasStim = row['Stimulus'] || row['Image in Stimulus'];
    if (hasStim) {
      // Collect all consecutive rows with same stimulus key
      const stimKey = (row['Image in Stimulus'] || '') + '|||' + (row['Stimulus'] || '');
      const group = [row];
      let j = i + 1;
      while (j < rows.length) {
        const nr = rows[j];
        const nk = (nr['Image in Stimulus'] || '') + '|||' + (nr['Stimulus'] || '');
        if (nk === stimKey) { group.push(nr); j++; }
        else break;
      }
      units.push({
        type: 'stem',
        stimulus: row['Stimulus'] || null,
        stimImgCode: row['Image in Stimulus'] || null,
        rows: group
      });
      i = j;
    } else {
      units.push({ type: 'standalone', row });
      i++;
    }
  }
  return units;
}

// Flatten units to count total questions
function countQuestionsInUnits(units) {
  return units.reduce((s, u) => s + (u.type === 'stem' ? u.rows.length : 1), 0);
}

// Get page slice of units (by question count, not unit count)
function getPageUnits(units, page) {
  const start = (page - 1) * PER_PAGE;
  const end = start + PER_PAGE;
  let qCount = 0;
  const result = [];
  for (const u of units) {
    const size = u.type === 'stem' ? u.rows.length : 1;
    if (qCount >= end) break;
    if (qCount + size > start) {
      result.push(u);
    }
    qCount += size;
  }
  return result;
}

// ── FILTERS ──
function toggleFilter(cat, val) {
  if (filters[cat].has(val)) filters[cat].delete(val); else filters[cat].add(val);
  currentPage = 1; buildSidebar(); renderContent();
}
function clearFilter(cat) { filters[cat].clear(); currentPage = 1; buildSidebar(); renderContent(); }
function toggleGroup(key) {
  document.getElementById('opts-'+key).classList.toggle('open');
  document.getElementById('arrow-'+key).classList.toggle('open');
}

// ── SIDEBAR ──
function buildSidebar() {
  const boards = [...new Set(allData.map(r=>r['Board Name']).filter(Boolean))].sort();
  const years  = [...new Set(allData.map(r=>r['Year']!=null?Math.round(r['Year']):null).filter(v=>v!=null))].sort((a,b)=>a-b);
  const chs    = [...new Set(allData.map(r=>r['Chapter']!=null?Math.round(r['Chapter']):null).filter(v=>v!=null))].sort((a,b)=>a-b);
  const groups = [
    { key:'board',   label:'Board',   values:boards.map(String), display:v=>v },
    { key:'year',    label:'Year',    values:years.map(String),  display:v=>v },
    { key:'chapter', label:'Chapter', values:chs.map(String),    display:v=>`অধ্যায় ${v}` },
  ];
  document.getElementById('sidebar').innerHTML = groups.map(g => {
    const sel = filters[g.key];
    return `<div class="filter-group">
      <div class="filter-header" onclick="toggleGroup('${g.key}')">
        <span class="filter-label">${g.label}</span>
        <div style="display:flex;align-items:center;gap:.45rem">
          ${sel.size > 0 ? `<span class="filter-sel-count">${sel.size}</span>` : ''}
          <span class="filter-arrow open" id="arrow-${g.key}">▶</span>
        </div>
      </div>
      <div class="filter-options open" id="opts-${g.key}">
        ${sel.size > 0 ? `<span class="clear-filter" onclick="clearFilter('${g.key}')">× সব বাদ</span>` : ''}
        ${g.values.map(v=>`
          <div class="filter-option ${sel.has(v)?'selected':''}" onclick="toggleFilter('${g.key}','${v}')">
            <div class="filter-checkbox"></div><span>${g.display(v)}</span>
          </div>`).join('')}
      </div>
    </div>`;
  }).join('');
}

// ── RENDER ──
let globalQNum = 1; // running question number for current page

function renderContent() {
  const filtered = getFilteredData();
  const allUnits = groupIntoUnits(filtered);
  const totalQ = countQuestionsInUnits(allUnits);
  const totalPages = Math.max(1, Math.ceil(totalQ / PER_PAGE));
  if (currentPage > totalPages) currentPage = 1;
  document.getElementById('result-count').textContent = `${totalQ} প্রশ্ন`;

  const content = document.getElementById('content');
  if (totalQ === 0) { content.innerHTML = '<div class="no-results">কোনো প্রশ্ন পাওয়া যায়নি</div>'; return; }

  // Compute starting question number for this page
  const pageUnits = getPageUnits(allUnits, currentPage);
  let startQ = (currentPage - 1) * PER_PAGE + 1;

  let html = '';
  let qNum = startQ;
  for (const unit of pageUnits) {
    if (unit.type === 'stem') {
      const qNums = unit.rows.map((_, k) => qNum + k);
      html += buildStemGroup(unit, qNums);
      qNum += unit.rows.length;
    } else {
      html += buildStandaloneCard(unit.row, qNum);
      qNum++;
    }
  }
  html += buildPagination(totalPages);
  content.innerHTML = html;

  if (window.MathJax && MathJax.typesetPromise) {
    MathJax.typesetPromise([content]).catch(()=>{});
  }
  renderImagesForPage();
}

// ── BUILD STEM GROUP ──
function buildStemGroup(unit, qNums) {
  const nums = qNums;
  // Build banner text: "নিচের তথ্যের ভিত্তিতে X, Y ও Z নং প্রশ্নের উত্তর দাও"
  let bannerNums = '';
  if (nums.length === 1) bannerNums = `${nums[0]}`;
  else if (nums.length === 2) bannerNums = `${nums[0]} ও ${nums[1]}`;
  else bannerNums = nums.slice(0,-1).join(', ') + ' ও ' + nums[nums.length-1];

  let stimHtml = '';
  if (unit.stimImgCode) {
    const cacheKey = unit.stimImgCode;
    const elId = 'imgel-stim-' + btoa(cacheKey.substring(0,40)).replace(/[^a-zA-Z0-9]/g,'');
    if (imageCache[cacheKey]) {
      stimHtml += `<div class="stimulus-img"><img src="${imageCache[cacheKey]}" alt="figure"></div>`;
    } else {
      stimHtml += `<div class="stimulus-img" id="${elId}"><div class="img-placeholder loading">⏳ ছবি তৈরি হচ্ছে...</div></div>`;
    }
  }
  if (unit.stimulus) {
    stimHtml += `<div class="stimulus-text">${unit.stimulus}</div>`;
  }

  const questionsHtml = unit.rows.map((row, k) => buildQuestionBlock(row, nums[k])).join('');

  return `<div class="stem-group">
    <div class="stem-banner">নিচের তথ্যের ভিত্তিতে ${bannerNums} নং প্রশ্নের উত্তর দাও</div>
    <div class="stimulus-body">${stimHtml}</div>
    ${questionsHtml}
  </div>`;
}

// ── BUILD STANDALONE CARD ──
function buildStandaloneCard(row, qNum) {
  return `<div class="standalone-card">${buildQuestionBlock(row, qNum)}</div>`;
}

// ── BUILD QUESTION BLOCK ──
const BN_KEYS = { A: 'ক', B: 'খ', C: 'গ', D: 'ঘ' };

function buildQuestionBlock(row, qNum) {
  const correct = (row['Correct  Option'] || row['Correct Option'] || '').toString().trim().toUpperCase();
  const board   = row['Board Name'] || '';
  const year    = row['Year'] ? Math.round(row['Year']) : '';
  const chapter = row['Chapter'] != null ? Math.round(row['Chapter']) : '';
  const uid     = row._id;

  // Question image
  let qImgHtml = '';
  if (row['Image in Question']) {
    const cacheKey = row['Image in Question'];
    const elId = 'imgel-q-' + uid;
    if (imageCache[cacheKey]) {
      qImgHtml = `<div class="question-img"><img src="${imageCache[cacheKey]}" alt="figure"></div>`;
    } else {
      qImgHtml = `<div class="question-img" id="${elId}"><div class="img-placeholder loading">⏳ ছবি তৈরি হচ্ছে...</div></div>`;
    }
  }

  const qText = row['Question'] || '';

  // Meta tags (board, year, chapter) — shown after question
  const metaHtml = (board || year || chapter) ? `<div class="q-meta" style="margin-top:.5rem;margin-bottom:.6rem">
    ${board   ? `<span class="q-tag">${board}</span>` : ''}
    ${year    ? `<span class="q-tag">${year}</span>` : ''}
    ${chapter ? `<span class="q-tag">অধ্যায় ${chapter}</span>` : ''}
  </div>` : '';

  // Statements
  let stmtHtml = '';
  const si=row['Statement i'], sii=row['Statement ii'], siii=row['Statement iii'];
  if (si||sii||siii) {
    const niche = row['নিচের কোনটি সঠিক?'] || '';
    stmtHtml = `<div class="statements">
      ${si   ? `<div class="statement-row"><span class="stmt-label">i.</span><span>${si}</span></div>` : ''}
      ${sii  ? `<div class="statement-row"><span class="stmt-label">ii.</span><span>${sii}</span></div>` : ''}
      ${siii ? `<div class="statement-row"><span class="stmt-label">iii.</span><span>${siii}</span></div>` : ''}
    </div>${niche ? `<div class="niche-text">${niche}</div>` : ''}`;
  }

  // Options with Bengali keys — support image options
  const pyCols = getPythonCols(row);
  const opts = [
    {key:'A', val:row['Option A']},
    {key:'B', val:row['Option B']},
    {key:'C', val:row['Option C']},
    {key:'D', val:row['Option D']},
  ];

  // If all 4 options are images, use single-column full-width grid
  const optColName = k => 'Option ' + k;
  const allOptsImage = opts.every(o => pyCols.has(optColName(o.key)));
  const gridClass = allOptsImage ? 'options-grid options-grid-img' : 'options-grid';

  const optsHtml = `<div class="${gridClass}" id="opts-${uid}">
    ${opts.map(o => {
      const isImg = pyCols.has(optColName(o.key));
      const elId = `imgel-opt-${uid}-${o.key}`;
      let innerHtml = '';
      if (isImg && o.val) {
        if (imageCache[o.val]) {
          innerHtml = `<div class="option-img"><img src="${imageCache[o.val]}" alt="figure"></div>`;
        } else {
          innerHtml = `<div class="option-img" id="${elId}"><div class="img-placeholder loading">⏳</div></div>`;
        }
      } else {
        innerHtml = `<span>${o.val!=null?o.val:'—'}</span>`;
      }
      return `<div class="option" data-key="${o.key}" data-correct="${correct}" data-uid="${uid}" onclick="handleAnswer(this)">
        <span class="option-key">${BN_KEYS[o.key]}.</span>
        ${innerHtml}
      </div>`;
    }).join('')}
  </div>`;

  // Explanation column (configurable)
  const EXPLANATION_COL = 'Explanation';
  const hasExplanation = row[EXPLANATION_COL] != null && row[EXPLANATION_COL] !== '';
  const hasStem = !!(row['Stimulus'] || row['Image in Stimulus']);
  const hasStatements = !!(row['Statement i'] || row['Statement ii'] || row['Statement iii']);

  return `<div class="question-block">
    <div class="q-header">
      <span class="q-num">${qNum}.</span>
      <span class="q-text-inline">${qImgHtml}${qText}</span>
    </div>
    ${metaHtml}${stmtHtml}${optsHtml}
    <div class="answer-footer" id="footer-${uid}">
      <div class="answer-bar" id="bar-${uid}">
        <span class="answer-verdict" id="verdict-${uid}"></span>
        ${hasExplanation ? `<button class="footer-btn explain-btn" id="explainbtn-${uid}" onclick="toggleExplanation('${uid}')">ব্যাখ্যা</button>` : ''}
        <button class="footer-btn report-btn" onclick="openReport('${uid}', ${hasStem}, ${hasStatements})">রিপোর্ট</button>
      </div>
      ${hasExplanation ? `<div class="explanation-panel" id="exp-${uid}"><div class="explanation-label">ব্যাখ্যা</div>${row[EXPLANATION_COL]}</div>` : ''}
    </div>
  </div>`;
}

// ── ANSWER HANDLER ──
function handleAnswer(el) {
  const uid = el.dataset.uid;
  const chosen = el.dataset.key;
  const correct = el.dataset.correct;
  const grid = document.getElementById('opts-' + uid);
  if (!grid || grid.querySelector('.answered')) return;

  // Mark options
  grid.querySelectorAll('.option').forEach(opt => {
    const k = opt.dataset.key;
    opt.classList.add('answered');
    if (k === correct) opt.classList.add('correct-reveal');
    else if (k === chosen && chosen !== correct) opt.classList.add('wrong');
  });

  // Show footer
  const footer = document.getElementById('footer-' + uid);
  const verdict = document.getElementById('verdict-' + uid);
  const bar = document.getElementById('bar-' + uid);
  const isCorrect = chosen === correct;
  if (footer) footer.classList.add('visible');
  if (verdict) {
    verdict.textContent = isCorrect ? 'সঠিক উত্তর' : 'ভুল উত্তর';
    verdict.className = 'answer-verdict ' + (isCorrect ? 'correct-text' : 'wrong-text');
  }
  if (bar) {
    bar.classList.add(isCorrect ? 'is-correct' : 'is-wrong');
  }
}

// ── EXPLANATION TOGGLE ──
function toggleExplanation(uid) {
  const panel = document.getElementById('exp-' + uid);
  const btn = document.getElementById('explainbtn-' + uid);
  if (!panel) return;
  const isOpen = panel.classList.toggle('visible');
  if (btn) btn.classList.toggle('active', isOpen);
  if (isOpen && window.MathJax && MathJax.typesetPromise) {
    MathJax.typesetPromise([panel]).catch(()=>{});
  }
}

// ── REPORT ──
let currentReportUid = null;

function openReport(uid, hasStem, hasStatements) {
  currentReportUid = uid;
  const opts = document.getElementById('report-options');
  document.getElementById('report-success').style.display = 'none';
  document.querySelector('.report-actions').style.display = 'flex';

  const items = [
    { id: 'r-question', label: 'প্রশ্ন ভুল', always: true },
    { id: 'r-stimulus', label: 'উদ্দীপক ভুল', show: hasStem },
    { id: 'r-statement', label: 'স্টেটমেন্ট ভুল (i, ii, iii)', show: hasStatements },
    { id: 'r-option', label: 'ডুপ্লিকেট অপশন বা অপশনে কোনো সমস্যা', always: true },
    { id: 'r-answer', label: 'উত্তর ভুল', always: true },
    { id: 'r-explain', label: 'ব্যাখ্যা ভুল', always: true },
    { id: 'r-spelling', label: 'বানান ভুল', always: true },
    { id: 'r-other', label: 'অন্যান্য', always: true, isOther: true },
  ];

  opts.innerHTML = items
    .filter(i => i.always || i.show)
    .map(i => `
      <label class="report-option">
        <input type="checkbox" id="${i.id}" ${i.isOther ? `onchange="toggleOtherBox(this)"` : ''}>
        <span>${i.label}</span>
      </label>
      ${i.isOther ? `<textarea class="report-other-box" id="other-text" placeholder="বিস্তারিত লিখুন..."></textarea>` : ''}
    `).join('');

  document.getElementById('report-overlay').classList.add('open');
}

function toggleOtherBox(cb) {
  const box = document.getElementById('other-text');
  if (box) box.style.display = cb.checked ? 'block' : 'none';
}

function closeReport() {
  document.getElementById('report-overlay').classList.remove('open');
  currentReportUid = null;
}

function closeReportIfBg(e) {
  if (e.target === document.getElementById('report-overlay')) closeReport();
}

function submitReport() {
  // Collect selected options
  const selected = [...document.querySelectorAll('.report-options input[type=checkbox]:checked')]
    .map(cb => cb.nextElementSibling?.textContent?.trim());
  const otherText = document.getElementById('other-text')?.value?.trim();
  if (otherText) selected.push('অন্যান্য: ' + otherText);
  if (selected.length === 0) return;

  // For now just show success (future: send to server)
  console.log('Report for uid', currentReportUid, ':', selected);
  document.querySelector('.report-actions').style.display = 'none';
  const success = document.getElementById('report-success');
  success.style.display = 'block';
  setTimeout(() => closeReport(), 1500);
}

// ── IMAGES ──
function getPythonCols(row) {
  const val = row['Python'];
  if (!val) return new Set();
  return new Set(val.split(',').map(s => s.trim()));
}

async function renderImagesForPage() {
  if (!pyodideReady) return;

  const filtered = getFilteredData();
  const allUnits = groupIntoUnits(filtered);
  const pageUnits = getPageUnits(allUnits, currentPage);

  for (const unit of pageUnits) {
    const rows = unit.type === 'stem' ? unit.rows : [unit.row];

    // Stem image (shared across group)
    if (unit.type === 'stem' && unit.stimImgCode) {
      await renderImageByCode(unit.stimImgCode, 'stim');
    }

    for (const row of rows) {
      const pyCols = getPythonCols(row);

      // Image in Question
      if (pyCols.has('Image in Question') && row['Image in Question']) {
        await renderImageByCode(row['Image in Question'], 'q', row._id);
      }

      // Options
      for (const optKey of ['Option A','Option B','Option C','Option D']) {
        if (pyCols.has(optKey) && row[optKey]) {
          const shortKey = optKey.split(' ')[1]; // 'A','B','C','D'
          await renderImageByCode(row[optKey], 'opt', row._id + '-' + shortKey);
        }
      }
    }
  }
}

async function renderImageByCode(code, imgType, uid) {
  if (imageCache[code]) {
    applyImageByCode(code, imgType, uid);
    return;
  }

  const py = `
import matplotlib
matplotlib.use('Agg')
import matplotlib.pyplot as plt
import io, base64
plt.close('all')
${code.replace(/plt\.show\(\)/g, '')}
buf = io.BytesIO()
plt.savefig(buf, format='png', bbox_inches='tight', dpi=90, facecolor=plt.gcf().get_facecolor())
plt.close('all')
buf.seek(0)
'data:image/png;base64,' + base64.b64encode(buf.read()).decode()
`;
  try {
    const dataUrl = await pyodide.runPythonAsync(py);
    imageCache[code] = dataUrl;
    applyImageByCode(code, imgType, uid);
  } catch(e) {
    // silent fail
  }
}

function applyImageByCode(code, imgType, uid) {
  const dataUrl = imageCache[code];
  if (!dataUrl) return;
  if (imgType === 'stim') {
    const elId = 'imgel-stim-' + btoa(code.substring(0,40)).replace(/[^a-zA-Z0-9]/g,'');
    const el = document.getElementById(elId);
    if (el) el.innerHTML = `<img src="${dataUrl}" alt="figure">`;
  } else if (imgType === 'q') {
    const el = document.getElementById('imgel-q-' + uid);
    if (el) el.innerHTML = `<img src="${dataUrl}" alt="figure">`;
  } else if (imgType === 'opt') {
    // uid format: rowId-Key e.g. "42-A"
    const el = document.getElementById('imgel-opt-' + uid);
    if (el) el.innerHTML = `<img src="${dataUrl}" alt="figure">`;
  }
}

// ── PAGINATION ──
function buildPagination(totalPages) {
  if (totalPages <= 1) return '';
  let pages = [];
  for (let i=1; i<=totalPages; i++) {
    if (i===1||i===totalPages||(i>=currentPage-2&&i<=currentPage+2)) pages.push(i);
    else if (pages[pages.length-1]!=='...') pages.push('...');
  }
  return `<div class="pagination">
    <button class="page-btn" onclick="goPage(${currentPage-1})" ${currentPage===1?'disabled':''}>← আগে</button>
    ${pages.map(p=>p==='...'
      ?`<span class="page-btn" style="pointer-events:none">…</span>`
      :`<button class="page-btn ${p===currentPage?'active':''}" onclick="goPage(${p})">${p}</button>`
    ).join('')}
    <button class="page-btn" onclick="goPage(${currentPage+1})" ${currentPage===totalPages?'disabled':''}>পরে →</button>
  </div>`;
}

function goPage(p) {
  const filtered = getFilteredData();
  const allUnits = groupIntoUnits(filtered);
  const total = Math.ceil(countQuestionsInUnits(allUnits) / PER_PAGE);
  if (p<1||p>total) return;
  currentPage = p;
  renderContent();
  document.getElementById('content').scrollTop = 0;
}

// ══ LEARN TAB ══
let learnCh = 1;
let learnTp = 1;

function learnChapters() {
  return [...new Set(allData.map(r => {
    const v = r['Chapter'];
    return v != null ? Math.round(Number(v)) : null;
  }).filter(v => v != null && !isNaN(v)))].sort((a,b) => a-b);
}

function learnTypes(ch) {
  return [...new Set(allData.filter(r => {
    const v = r['Chapter'];
    return v != null && Math.round(Number(v)) === ch;
  }).map(r => {
    const v = r['Type'];
    return v != null ? Math.round(Number(v)) : null;
  }).filter(v => v != null && !isNaN(v)))].sort((a,b) => a-b);
}

function learnFiltered() {
  return allData.filter(r => {
    const cv = r['Chapter'], tv = r['Type'];
    return cv != null && tv != null &&
      Math.round(Number(cv)) === learnCh &&
      Math.round(Number(tv)) === learnTp;
  });
}

function buildLearnSidebar() {
  const chs = learnChapters();
  const tps = learnTypes(learnCh);
  let html = '<div class="learn-sec-label">অধ্যায়</div>';
  html += chs.map(c =>
    `<button class="learn-ch-btn${c===learnCh?' active':''}" onclick="selectLearnCh(${c})"><div class="learn-circle"></div>অধ্যায় ${c}</button>`
  ).join('');
  if (tps.length) {
    html += '<hr class="learn-divider"><div class="learn-sec-label">টপিক</div>';
    html += tps.map(t =>
      `<button class="learn-tp-btn${t===learnTp?' active':''}" onclick="selectLearnTp(${t})"><div class="learn-circle"></div>Type-${t}</button>`
    ).join('');
  }
  document.getElementById('learn-sidebar-inner').innerHTML = html;
}

function selectLearnCh(ch) {
  learnCh = ch;
  const tps = learnTypes(ch);
  learnTp = tps.length ? tps[0] : 1;
  buildLearnSidebar();
  renderLearnContent();
}

function selectLearnTp(tp) {
  learnTp = tp;
  buildLearnSidebar();
  renderLearnContent();
}

function renderLearnContent() {
  const el = document.getElementById('learn-content');
  if (!el) return;
  const rows = learnFiltered();
  if (!rows.length) {
    el.innerHTML = '<div style="padding:2rem;color:#888">কোনো প্রশ্ন পাওয়া যায়নি</div>';
    return;
  }
  const units = groupIntoUnits(rows);
  let html = '', qNum = 1;
  for (const unit of units) {
    if (unit.type === 'stem') {
      html += buildStemGroup(unit, unit.rows.map((_,k) => qNum+k));
      qNum += unit.rows.length;
    } else {
      html += buildStandaloneCard(unit.row, qNum++);
    }
  }
  el.innerHTML = html;
  if (window.MathJax && MathJax.typesetPromise) MathJax.typesetPromise([el]).catch(()=>{});
  renderImagesForLearn(units);
}

async function renderImagesForLearn(units) {
  if (!pyodideReady) return;
  for (const unit of units) {
    const rows = unit.type === 'stem' ? unit.rows : [unit.row];
    if (unit.type === 'stem' && unit.stimImgCode) {
      await renderImageByCode(unit.stimImgCode, 'stim');
    }
    for (const row of rows) {
      const pyCols = getPythonCols(row);
      if (pyCols.has('Image in Question') && row['Image in Question']) {
        await renderImageByCode(row['Image in Question'], 'q', row._id);
      }
      for (const optKey of ['Option A','Option B','Option C','Option D']) {
        if (pyCols.has(optKey) && row[optKey]) {
          await renderImageByCode(row[optKey], 'opt', row._id + '-' + optKey.split(' ')[1]);
        }
      }
    }
  }
}

function initLearn() {
  const chs = learnChapters();
  if (!chs.length) return;
  learnCh = chs[0];
  const tps = learnTypes(learnCh);
  learnTp = tps.length ? tps[0] : 1;
  // sidebar only, content renders when tab is opened
  buildLearnSidebar();
}
